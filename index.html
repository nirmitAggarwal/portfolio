    <script type="application/ld+json">

    <script>
      // Set theme before paint to avoid a flash of the wrong scheme.
      // Default is LIGHT; dark only applies when explicitly stored.
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
